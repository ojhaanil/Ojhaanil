<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Anil Kumar Ojha - SAP SuccessFactors HR Technology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080D"/>
      <stop offset="55%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0E1B2C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#69D2FF"/>
    </linearGradient>
    <filter id="softGlow">
