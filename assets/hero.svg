    <text x="157" y="96" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">INTEGRATE</text>
    <text x="24" y="125" fill="#00AEEF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TEST</text>
