  <path d="M0 314 C190 255 320 344 515 292 S850 232 1200 276" fill="none" stroke="#00AEEF" stroke-opacity=".08" stroke-width="2"/>

  <rect x="70" y="54" width="6" height="236" rx="3" fill="url(#blue)" filter="url(#softGlow)"/>

  <text x="108" y="101" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="2">ANIL KUMAR OJHA</text>
