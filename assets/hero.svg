<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Anil Kumar Ojha - SAP SuccessFactors Consultant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0FAAFF"/>
      <stop offset="100%" stop-color="#5BC8FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="170" fill="#0FAAFF" opacity=".07"/>
  <circle cx="1120" cy="260" r="130" fill="#0FAAFF" opacity=".05"/>

  <path d="M0 258 C180 205 280 292 450 238 S760 165 1200 215" fill="none" stroke="#0FAAFF" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 276 C210 225 310 308 500 255 S790 190 1200 230" fill="none" stroke="#0FAAFF" stroke-opacity=".10" stroke-width="2"/>

  <rect x="70" y="58" width="6" height="178" rx="3" fill="url(#accent)" filter="url(#glow)"/>

  <text x="105" y="105" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="2">ANIL KUMAR OJHA</text>
  <text x="108" y="151" fill="#B8C4D6" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1.2">SENIOR SAP SUCCESSFACTORS CONSULTANT</text>
  <text x="108" y="190" fill="#0FAAFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">EMPLOYEE CENTRAL  |  ONBOARDING 2.0  |  TIME OFF</text>
  <text x="108" y="219" fill="#0FAAFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">TALENT INTELLIGENCE HUB  |  REPORTING</text>

  <g transform="translate(890 92)">
    <rect width="210" height="132" rx="16" fill="#0B1220" stroke="#26364D"/>
    <text x="24" y="35" fill="#7F91AA" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">HR TECHNOLOGY</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">SAP</text>
    <text x="24" y="98" fill="#B8C4D6" font-family="Arial, Helvetica, sans-serif" font-size="14">Solution Design</text>
    <text x="24" y="118" fill="#B8C4D6" font-family="Arial, Helvetica, sans-serif" font-size="14">Configuration + Delivery</text>
